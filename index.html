<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">Meteo</div>

      <div class="search-wrapper">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a867d" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Cerca città" autocomplete="off">
        </div>
        <div id="searchDropdown" class="search-dropdown d-none"></div>
      </div>

      <div class="city-section">
        <div class="city-section-label">Città</div>
        <div id="cityList" class="city-list"></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-area">

      <!-- Loading overlay -->
      <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="loading-spinner"></div>
      </div>

      <!-- Header -->
      <div class="main-header d-flex justify-content-between align-items-start">
        <div>
          <div id="headerDate" class="header-date"></div>
          <div id="headerCity" class="header-city"></div>
        </div>
        <div class="d-flex align-items-start gap-4">
          <button id="langToggle" class="lang-toggle">EN</button>
          <div class="text-end">
            <div id="feelsLikeLabel" class="header-label">Percepita</div>
            <div id="headerFeelsLike" class="header-feels"></div>
          </div>
        </div>
      </div>

      <!-- Hero Card -->
      <div class="hero-card d-flex align-items-center justify-content-between">
        <div>
          <div id="heroTemp" class="hero-temp"></div>
          <div id="heroCondition" class="hero-condition"></div>
          <div id="heroMinMax" class="hero-minmax"></div>
        </div>
        <div id="heroIcon" class="hero-icon"></div>
      </div>

      <!-- Previsioni orarie -->
      <div id="hourlyRow" class="hourly-row"></div>

      <!-- Bottom: 7 giorni + dettagli -->
      <div class="bottom-row d-flex gap-4 flex-1">

        <div class="card-week">
          <div id="weekTitle" class="card-title">Prossimi 7 giorni</div>
          <div id="weekList"></div>
        </div>

        <div id="detailsGrid" class="details-grid"></div>

      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
